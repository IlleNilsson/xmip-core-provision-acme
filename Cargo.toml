[package]
name = "xmip-core-provision-acme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-provision-acme"
description = "ACME (RFC 8555): a certificate obtained and renewed from any ACME directory a node names. A xmip-core-provision technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the key, the CSR, the purpose and the trait.
provision = { workspace = true }
# The settings shape the technology declares its configuration in.
xcore = { workspace = true }
# Xmip's own HTTP and TLS, never a platform client (CONTRIBUTING.md,
# dogfooding): the request and its answer, the connection, the URL.
net = { workspace = true }
tls = { workspace = true }
# Base64url for the certificate request, SHA-256 for a dns-01 record.
codec = { workspace = true }
# The JWS every request is and the account key's JWK and thumbprint, written
# and checked by the estate's one JOSE: the client signs with it and the
# authority that serves ACME (internal-ca) verifies with it.
jose = { workspace = true, features = ["key"] }
# ACME's objects are JSON (RFC 8555 section 7), as the estate reads JSON
# elsewhere (jose).
serde_json = "1"
zeroize = "1"
# The account key is a private file, written once in the key home
# (secret::private_file).
secret = { workspace = true }

[dev-dependencies]
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
